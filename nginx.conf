server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos: o nginx nao sabe que esta atras de HTTPS,
    # entao "Location: /pdv-lev/" deixa o navegador manter https://www...
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Sem a barra final os caminhos relativos (estilos.css, img/...) quebram.
    location = /pdv-lev {
        return 301 /pdv-lev/;
    }

    location /pdv-lev/ {
        try_files $uri $uri/ =404;
    }

    # Imagens e fonte mudam pouco; CSS/JS podem mudar sem trocar de nome.
    location ~* ^/pdv-lev/.+\.(webp|png|jpg|svg|woff2)$ {
        expires 30d;
        access_log off;
    }
    location ~* ^/pdv-lev/.+\.(css|js)$ {
        expires 1d;
    }
}
